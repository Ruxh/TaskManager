{% load crispy_forms_tags %}
<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Task List</title>
</head>
<body class="container">
  <h1 class="mt-4">Task List</h1>
  <a href="{% url 'task_create' %}" class="btn btn-primary mb-3">Add Task</a>
  <ul class="list-group">
    {% for task in tasks %}
      <li class="list-group-item d-flex justify-content-between">
        <span>{{ task.title }} {% if task.completed %}<span class="badge bg-success">Done</span>{% endif %}</span>
        {% if not task.completed %}
          <a href="{% url 'task_complete' task.pk %}" class="btn btn-sm btn-outline-success">Mark as Done</a>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</body>
</html>
